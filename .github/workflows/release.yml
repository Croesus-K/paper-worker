name: Build & Release

# 推送 v* 格式的 tag 即自动三平台打包并发布 Release
# 用法: git tag v2.12 && git push origin v2.12
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 测试门禁：测试不通过则中止发布
      - name: Run tests
        run: python tests/test_logic.py

      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2

      - name: Build binary
        shell: bash
        run: |
          python -m PyInstaller --onefile --windowed \
            --name "PaperWorker-${{ github.ref_name }}-${{ matrix.slug }}" \
            --collect-all tkinterdnd2 \
            "全能TXT文本处理器.py"

      # macOS 的 windowed 模式会额外产出 .app 目录包，上传 artifact 前移除，只留单文件
      - name: Remove macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: rm -rf dist/*.app

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWorker-${{ github.ref_name }}-${{ matrix.slug }}
          path: dist/PaperWorker-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Collect binaries (files only)
        run: |
          mkdir -p release_files
          find dist -maxdepth 1 -type f -name "PaperWorker-*" -exec cp {} release_files/ \;
          ls -l release_files

      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "全能TXT文本处理器 ${{ github.ref_name }}" \
            --notes "自动构建于 GitHub Actions（提交 ${{ github.sha }}）。Windows 下载 PaperWorker-*-windows.exe，Linux/macOS 下载对应后缀文件并 chmod +x 后运行（需要图形环境）。杀软若误报请添加信任或从源码运行。" \
            release_files/PaperWorker-* \
          || gh release upload "${{ github.ref_name }}" release_files/PaperWorker-* --clobber
