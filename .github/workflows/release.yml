name: Build & Release

# 推送 v* 格式的 tag 即自动打包并发布 Release
# 用法: git tag v2.3 && git push origin v2.3
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2

      - name: Build exe
        shell: bash
        run: |
          python -m PyInstaller --onefile --windowed \
            --name "PaperWorker-${{ github.ref_name }}" \
            --collect-all tkinterdnd2 \
            "全能TXT文本处理器.py"

      - name: Create release and upload exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "全能TXT文本处理器 ${{ github.ref_name }}" \
            --notes "自动构建于 GitHub Actions（提交 ${{ github.sha }}）。下载 PaperWorker-*.exe 双击即用，无需安装 Python（已内置拖放支持）。杀软若误报请添加信任或从源码运行。" \
            "dist/PaperWorker-${{ github.ref_name }}.exe" \
          || gh release upload "${{ github.ref_name }}" "dist/PaperWorker-${{ github.ref_name }}.exe" --clobber
