name: Build & Release

# 推送 v* 格式的 tag 即自动三平台打包并发布 Release
# 用法: git tag v2.12 && git push origin v2.12
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 测试门禁：测试不通过则中止发布
      - name: Run tests
        run: python tests/test_logic.py

      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2

      # UPX 压缩体积（macOS 不支持，跳过）；排除 vcruntime 避免启动异常与误报
      - name: Install UPX (windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y --no-progress
      - name: Install UPX (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build binary
        shell: bash
        run: |
          python -m PyInstaller --onefile --windowed \
            --name "PaperWorker-${{ github.ref_name }}-${{ matrix.slug }}" \
            --collect-all tkinterdnd2 \
            --upx-exclude vcruntime140.dll \
            --upx-exclude vcruntime140_1.dll \
            "全能TXT文本处理器.py"

      # macOS 的 windowed 模式会额外产出 .app 目录包，上传 artifact 前移除，只留单文件
      - name: Remove macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: rm -rf dist/*.app

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWorker-${{ github.ref_name }}-${{ matrix.slug }}
          path: dist/PaperWorker-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Collect binaries (files only)
        run: |
          mkdir -p release_files
          find dist -maxdepth 1 -type f -name "PaperWorker-*" -exec cp {} release_files/ \;
          ls -l release_files

      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "全能TXT文本处理器 ${{ github.ref_name }}" \
            --notes "自动构建于 GitHub Actions（提交 ${{ github.sha }}）。Windows 下载 PaperWorker-*-windows.exe，Linux/macOS 下载对应后缀文件并 chmod +x 后运行（需要图形环境）。杀软若误报请添加信任或从源码运行。" \
            release_files/PaperWorker-* \
          || gh release upload "${{ github.ref_name }}" release_files/PaperWorker-* --clobber

      - name: Update scoop manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import base64, hashlib, json, os, urllib.request

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          exe = f"release_files/PaperWorker-{tag}-windows.exe"
          if not os.path.exists(exe):
              print("windows 可执行文件不存在，跳过清单更新")
              raise SystemExit(0)
          with open(exe, "rb") as f:
              sha = hashlib.sha256(f.read()).hexdigest()
          manifest = {
              "version": version,
              "homepage": "https://github.com/Croesus-K/paper-worker",
              "description": "全能TXT文本处理器 —— 中文 TXT 批量处理：编码转换、查找替换、章节分割、小说清洗、EPUB/DOCX 导出、统计报告、Web 工作台。",
              "license": "MIT",
              "notes": "双击 PaperWorker-*.exe 启动图形界面；命令行模式下同目录执行该程序即可（serve/split/epub 等子命令）。",
              "url": f"https://github.com/Croesus-K/paper-worker/releases/download/{tag}/PaperWorker-{tag}-windows.exe",
              "hash": sha,
              "bin": f"PaperWorker-{tag}-windows.exe",
              "shortcuts": [[f"PaperWorker-{tag}-windows.exe", "全能TXT文本处理器"]],
              "checkver": "github",
              "autoupdate": {
                  "url": "https://github.com/Croesus-K/paper-worker/releases/download/v$version/PaperWorker-v$version-windows.exe",
                  "bin": "PaperWorker-v$version-windows.exe",
                  "shortcuts": [["PaperWorker-v$version-windows.exe", "全能TXT文本处理器"]],
              },
          }
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/paper-worker.json"
          headers = {"Authorization": f"token {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json"}
          try:
              with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as r:
                  file_sha = json.load(r)["sha"]
          except Exception:
              file_sha = None
          content = base64.b64encode(json.dumps(
              manifest, ensure_ascii=False, indent=4).encode("utf-8")).decode()
          body = {"message": f"chore: scoop manifest {tag} [skip ci]",
                  "content": content}
          if file_sha:
              body["sha"] = file_sha
          req = urllib.request.Request(api, data=json.dumps(body).encode(), headers=headers, method="PUT")
          with urllib.request.urlopen(req) as r:
              print("scoop 清单已更新:", json.load(r)["commit"]["sha"][:8])
          EOF
